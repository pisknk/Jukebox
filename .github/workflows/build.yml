name: Build IPA

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          xcodebuild -project Jukebox/Jukebox.xcodeproj \
            -target Jukebox \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Jukebox.app Payload/
          zip -qry Jukebox.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jukebox-ipa
          path: Jukebox.ipa
